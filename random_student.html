<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽取学生</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to bottom, #f0f4f8, #d9e2ec);
            color: #333;
            min-height: 100vh;
        }
        h1 { color: #2c5282; margin-bottom: 10px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 420px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .radio-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        input[type="radio"] {
            transform: scale(1.3);
            margin-right: 8px;
        }
        label { font-size: 17px; cursor: pointer; }
        input[type="number"] {
            padding: 10px 12px;
            margin: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            width: 100px;
            font-size: 16px;
        }
        button {
            padding: 12px 28px;
            margin: 12px 8px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .primary {
            background: #3182ce;
            color: white;
        }
        .primary:hover { background: #2b6cb0; transform: translateY(-1px); }
        .secondary {
            background: #edf2f7;
            color: #4a5568;
        }
        .secondary:hover { background: #e2e8f0; }
        #result {
            font-size: 28px;
            font-weight: bold;
            color: #c53030;
            margin: 30px 0;
            min-height: 50px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #result.show { opacity: 1; }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        td {
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            min-width: 60px;
            text-align: center;
            font-size: 15px;
        }
        td:first-child { background: #ebf8ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>随机抽取学生</h1>

    <div class="radio-group">
        <div>
            <input type="radio" id="modeNumber" name="drawMode" value="number" checked onchange="toggleInputs()">
            <label for="modeNumber">按学号抽取</label>
        </div>
        <div>
            <input type="radio" id="modeSeat" name="drawMode" value="seat" onchange="toggleInputs()">
            <label for="modeSeat">按座位抽取</label>
        </div>
    </div>

    <!-- 学号模式参数 -->
    <div id="numberSettings">
        <label>学号范围：1 ～ </label>
        <input type="number" id="maxNumber" value="50" min="1">
        <span>号</span>
    </div>

    <!-- 座位模式参数 -->
    <div id="seatSettings" style="display:none;">
        <label>座位排列：</label>
        <input type="number" id="rows" value="6" min="1"> 行 ×
        <input type="number" id="cols" value="8" min="1"> 列
        <div style="margin-top:8px; color:#718096; font-size:14px;">
            总人数 = 行 × 列 = <span id="totalFromSeat">48</span> 人
        </div>
    </div>

    <button class="primary" onclick="updateSettings()">更新设置</button>
    <button class="primary" onclick="drawStudent()">随机抽取</button>
    <button class="secondary" onclick="toggleTable()">显示/隐藏座位表</button>

    <div id="result"></div>
</div>

<table id="seatTable" style="display:none;"></table>

<script>
    let mode = 'number';
    let maxNumber = 50;
    let rows = 6;
    let cols = 8;
    let students = [];

    function toggleInputs() {
        mode = document.querySelector('input[name="drawMode"]:checked').value;
        document.getElementById('numberSettings').style.display = mode === 'number' ? 'block' : 'none';
        document.getElementById('seatSettings').style.display = mode === 'seat' ? 'block' : 'none';
    }

    function updateSettings() {
        const resultDiv = document.getElementById('result');
        resultDiv.classList.remove('show');
        resultDiv.innerText = '';

        if (mode === 'number') {
            maxNumber = parseInt(document.getElementById('maxNumber').value) || 50;
            if (maxNumber < 1) maxNumber = 1;
            students = Array.from({length: maxNumber}, (_, i) => i + 1);
            alert(`已更新：学号 1～${maxNumber} 号，共 ${maxNumber} 人`);
        } else {
            rows = parseInt(document.getElementById('rows').value) || 1;
            cols = parseInt(document.getElementById('cols').value) || 1;
            if (rows < 1) rows = 1;
            if (cols < 1) cols = 1;
            const total = rows * cols;
            document.getElementById('totalFromSeat').innerText = total;
            students = Array.from({length: total}, (_, i) => i + 1);
            alert(`已更新：${rows}行 × ${cols}列，共 ${total} 人`);
        }

        document.getElementById('seatTable').style.display = 'none';
    }

    // 初始加载
    updateSettings();
    toggleInputs();

    function drawStudent() {
        if (students.length === 0) return;

        const randomIndex = Math.floor(Math.random() * students.length);
        const studentNum = students[randomIndex];
        let text = '';

        if (mode === 'number') {
            text = `抽中学号：${studentNum} 号`;
        } else {
            const row = Math.floor(randomIndex / cols) + 1;
            const col = (randomIndex % cols) + 1;
            text = `抽中座位：第 ${row} 行 第 ${col} 座（${studentNum}号）`;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.innerText = text;
        resultDiv.classList.remove('show');
        setTimeout(() => resultDiv.classList.add('show'), 50);
    }

    function generateTable() {
        const table = document.getElementById('seatTable');
        table.innerHTML = '';
        let rowEl;

        for (let r = 0; r < (mode === 'seat' ? rows : Math.ceil(students.length / 8)); r++) {
            rowEl = table.insertRow();
            for (let c = 0; c < (mode === 'seat' ? cols : 8); c++) {
                const index = r * (mode === 'seat' ? cols : 8) + c;
                if (index >= students.length) break;
                const cell = rowEl.insertCell();
                cell.innerText = students[index] + '号';
            }
        }
    }

    function toggleTable() {
        const table = document.getElementById('seatTable');
        if (table.style.display === 'none') {
            generateTable();
            table.style.display = 'table';
        } else {
            table.style.display = 'none';
        }
    }

    // 座位模式下实时更新总人数显示
    document.getElementById('rows').addEventListener('input', () => {
        if (mode === 'seat') {
            const r = parseInt(document.getElementById('rows').value) || 0;
            const c = parseInt(document.getElementById('cols').value) || 0;
            document.getElementById('totalFromSeat').innerText = r * c;
        }
    });
    document.getElementById('cols').addEventListener('input', () => {
        if (mode === 'seat') {
            const r = parseInt(document.getElementById('rows').value) || 0;
            const c = parseInt(document.getElementById('cols').value) || 0;
            document.getElementById('totalFromSeat').innerText = r * c;
        }
    });
</script>
</body>
</html>
